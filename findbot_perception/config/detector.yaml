object_detector:
  ros__parameters:
    use_sim_time: true
    model: /home/ari/findbot_models/yolo11n.pt
    confidence: 0.4
    max_rate: 2.0
    target_frame: map
    image_size: 640
    ignore_classes: ['']

semantic_map:
  ros__parameters:
    use_sim_time: true
    merge_radius: 0.6
    min_observations: 3
    conflict_radius: 0.4
    min_confidence: 0.45
    # Classes YOLO hallucinated on walls / pillars / floor shadows in the test run
    # (none of them exist in the arena). Detections on mapped obstacles are also rejected.
    ignore_labels: ['airplane', 'tv', 'refrigerator', 'toilet', 'bench', 'umbrella', 'traffic light']
    static_map_reject_radius: 0.1
    memory_file: /home/ari/.findbot/semantic_map.yaml
    load_memory: true
